        - generic [ref=f2e157]:
          - generic [ref=f2e158]:
            - heading "Xbox 360 Controller Emulator 4.x Alpha - Beta Testing" [level=1] [ref=f2e159]
            - 'link "Permalink: Xbox 360 Controller Emulator 4.x Alpha - Beta Testing" [ref=f2e160] [cursor=pointer]':
              - /url: "#xbox-360-controller-emulator-4x-alpha---beta-testing"
              - img [ref=f2e161]
          - paragraph [ref=f2e163]: This is ALPHA release. Some things will not work and this release is intended to test games with Virtual X360 controller only.
          - generic [ref=f2e164]:
            - heading "IMPORTANT Notes" [level=2] [ref=f2e165]
            - 'link "Permalink: IMPORTANT Notes" [ref=f2e166] [cursor=pointer]':
              - /url: "#important-notes"
              - img [ref=f2e167]
          - list [ref=f2e169]:
            - listitem [ref=f2e170]:
              - paragraph [ref=f2e171]: "There is no need to place x360ce.exe inside the game folder. You can keep single copy of executable at one place (for example: C:\\Program Files\\x360ce\\x360ce.exe), because same virtual \"Xbox 360 Controller\" will be visible for all games in Windows."
            - listitem [ref=f2e172]:
              - paragraph [ref=f2e173]: Do not close "Xbox 360 Controller Emulator" during the game, just minimize it in order to reduce CPU use.
            - listitem [ref=f2e174]:
              - paragraph [ref=f2e175]:
                - text: "Make sure your game is set to use XInput Devices. For example, in \"Tom Clancy's Ghost Recon Wildlands\" you have to set OPTIONS -> CONTROLLER -> ENABLE CONTROLLER:"
                - emphasis [ref=f2e176]: ONLY GAMEPADS
          - generic [ref=f2e177]:
            - heading "Install and Use Instructions" [level=2] [ref=f2e178]
            - 'link "Permalink: Install and Use Instructions" [ref=f2e179] [cursor=pointer]':
              - /url: "#install-and-use-instructions"
              - img [ref=f2e180]
          - list [ref=f2e182]:
            - listitem [ref=f2e183]:
              - paragraph [ref=f2e184]: "Download latest Xbox 360 Controller Emulator (same file for 32-bit and 64-bit Windows) from:"
              - paragraph [ref=f2e185]:
                - link "x360ce 4.x.x.x - Releases Page" [ref=f2e186] [cursor=pointer]:
                  - /url: https://github.com/x360ce/x360ce/releases
            - listitem [ref=f2e187]:
              - paragraph [ref=f2e188]: Extract ZIP file and launch x360ce.exe file.
          - paragraph [ref=f2e189]: "Enabling Virtual Drivers:"
          - list [ref=f2e190]:
            - listitem [ref=f2e191]: "[Issues] tab will start blinking it Virtual Drivers are missing."
            - listitem [ref=f2e192]: Press [Issues] tab and hit [Install] button to install Virtual Controller Drivers.
          - paragraph [ref=f2e193]: "Mapping DirectInput Device:"
          - list [ref=f2e194]:
            - listitem [ref=f2e195]: Connect your DirectInput Device to PC
            - listitem [ref=f2e196]: Select [Controller 1] tab and press [Add..] button.
            - listitem [ref=f2e197]: Select controller you want to map and press [OK] button.
            - listitem [ref=f2e198]: Click "[x] Enable 1 Mapped Device" checkbox inside [Controller 1] tab.
          - paragraph [ref=f2e199]: "Configuring Mapping:"
          - list [ref=f2e200]:
            - listitem [ref=f2e201]:
              - paragraph [ref=f2e202]: Map buttons and axis by clicking on dropdowns, selecting [Record] and pressing on button or moving axis. 10 Hit [Save] button (at top right corner of application) when done.
            - listitem [ref=f2e203]:
              - paragraph [ref=f2e204]: "Minimize \"Xbox 360 Controller Emulator\" in order to reduce CPU use. Note: Grey controller icon will be visible in tray."
            - listitem [ref=f2e205]:
              - paragraph [ref=f2e206]: Launch the game and see how it works.
          - paragraph [ref=f2e207]: "How to Uninstall Virtual Driver: Run \"Xbox 360 Controller Emulator\" as an Administrator, go to [Options] tab and press [Uninstall] button inside \"Virtual Device\" group box."
