                      - row "x0618 - x0690 1560 - 1680 3900 - 4200 8 - Full" [ref=f16e1257]:
                        - cell "x0618 - x0690" [ref=f16e1258]:
                          - code [ref=f16e1259]: x0618
                          - text: "-"
