                        - cell "01" [ref=f16e1166]:
                          - code [ref=f16e1167]: "01"
                        - cell "Always x01 for writing" [ref=f16e1168]:
                          - text: Always
                          - code [ref=f16e1169]: x01
                          - text: for writing
                      - row "02 Value to write" [ref=f16e1170]:
                        - cell "02" [ref=f16e1171]:
