                      - row "x05A0 - x05DF 1440 - 1503 3600 - 3759 4 - Low" [ref=f16e1243]:
                        - cell "x05A0 - x05DF" [ref=f16e1244]:
                          - code [ref=f16e1245]: x05A0
                          - text: "-"
                          - code [ref=f16e1246]: x05DF
                        - cell "1440 - 1503" [ref=f16e1247]
