                        - cell "Value to write" [ref=f16e1173]
                  - generic [ref=f16e1174]:
                    - 'heading "Subcommand 0x43: Read IMU registers" [level=3] [ref=f16e1175]'
                    - 'link "Permalink: Subcommand 0x43: Read IMU registers" [ref=f16e1176] [cursor=pointer]':
                      - /url: "#subcommand-0x43-read-imu-registers"
                      - img [ref=f16e1177]
                  - paragraph [ref=f16e1179]: It takes 2 uint8t_t.
                  - table [ref=f16e1181]:
                    - rowgroup [ref=f16e1182]:
                      - 'row "Byte # Remarks" [ref=f16e1183]':
                        - 'columnheader "Byte #" [ref=f16e1184]'
                        - columnheader "Remarks" [ref=f16e1185]
                    - rowgroup [ref=f16e1186]:
                      - row "00 Register start address" [ref=f16e1187]:
                        - cell "00" [ref=f16e1188]:
                          - code [ref=f16e1189]: "00"
                        - cell "Register start address" [ref=f16e1190]
                      - row "01 Registers to show. Max x20" [ref=f16e1191]:
                        - cell "01" [ref=f16e1192]:
                          - code [ref=f16e1193]: "01"
                        - cell "Registers to show. Max x20" [ref=f16e1194]
                  - paragraph [ref=f16e1195]:
                    - text: It replies with
                    - code [ref=f16e1196]: xC043##$$
                    - text: ", where ## is the first register address to show and $$ is how many registers to show. After these the data follows."
                  - paragraph [ref=f16e1197]:
                    - text: For example, by sending
                    - code [ref=f16e1198]: x0020
                    - text: you can view registers
                    - code [ref=f16e1199]: x00
                    - text: "-"
                    - code [ref=f16e1200]: x1F
                    - text: ","
                    - code [ref=f16e1201]: x2020
                    - text: ":"
                    - code [ref=f16e1202]: x20
                    - text: "-"
                    - code [ref=f16e1203]: x2F
                    - text: ", etc."
                  - paragraph [ref=f16e1204]:
                    - text: To quickly get the register you need, send
                    - code [ref=f16e1205]: x##01
                    - text: (## is the register address) and parse the 1st byte after the subcmd + args reply (
                    - code [ref=f16e1206]: xC043##$$
                    - text: ).
                  - paragraph [ref=f16e1207]: Consult LSM6DS3.pdf for all registers and their meaning. The registers addresses are mapped 1:1 in the subcmd.
