                      - /url: "#subcommand-0x42-write-to-imu-registers"
                      - img [ref=f16e1149]
                  - paragraph [ref=f16e1151]: It takes 3 uint8_t arguments and writes to the selected register. You can write only writable registers (r/w).
                  - paragraph [ref=f16e1152]: Consult LSM6DS3.pdf for all registers and their meaning. The registers addresses are mapped 1:1 in the subcmd.
                  - paragraph [ref=f16e1153]: With this subcmd you can completely control the IMU.
                  - table [ref=f16e1155]:
                    - rowgroup [ref=f16e1156]:
