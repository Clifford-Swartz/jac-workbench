                  - generic [ref=f16e1216]:
                    - 'heading "Subcommand 0x50: Get regulated voltage" [level=3] [ref=f16e1217]'
                    - 'link "Permalink: Subcommand 0x50: Get regulated voltage" [ref=f16e1218] [cursor=pointer]':
                      - /url: "#subcommand-0x50-get-regulated-voltage"
                      - img [ref=f16e1219]
                  - paragraph [ref=f16e1221]:
                    - text: Replies with ACK
                    - code [ref=f16e1222]: xD0
                    - code [ref=f16e1223]: x50
                    - text: and a little-endian uint16. Raises when charging a Joy-Con.
                  - paragraph [ref=f16e1224]: Internally, the values come from 1000mV - 1800mV regulated voltage samples, that are translated to 1320-1680 values.
                  - paragraph [ref=f16e1225]: These follow a curve between 3.3V and 4.2V (tested with multimeter). So a 2.5x multiplier can get us the real battery voltage in mV.
                  - paragraph [ref=f16e1226]: "Based on this info, we have the following table:"
