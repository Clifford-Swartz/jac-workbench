                      - paragraph [ref=f2e687]: Then... I re-connected the Chinese controller. Both devices look the same in Bluetooth devices and Device Manager, except the Nintendo controller has a gamepad icon in Bluetooth devices and the Chinese controller has a keyboard/mouse icon. After re-connecting the Chinese controller, the Switch controller no longer works in x360ce, etc. both controllers now work as in the first scenario (recognized by Chrome, but not in the Windows dialog).
