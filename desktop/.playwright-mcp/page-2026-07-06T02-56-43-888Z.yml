                    - /url: "#system-requirements"
                    - img [ref=f37e689]
                - list [ref=f37e691]:
                  - listitem [ref=f37e692]: Windows Vista or newer.
                  - listitem [ref=f37e693]:
                    - link ".NET 3.5 (also installs 2.0 and 3.0)" [ref=f37e694] [cursor=pointer]:
                      - /url: http://www.microsoft.com/en-us/download/details.aspx?id=22
                    - text: (included in Windows 7)
                  - listitem [ref=f37e695]:
                    - link ".NET 4.0 (link to 4.6, also installs 4.0)" [ref=f37e696] [cursor=pointer]:
                      - /url: http://www.microsoft.com/en-us/download/details.aspx?id=48130
                    - text: (included in Windows 8 and 10)
                  - listitem [ref=f37e697]:
                    - link "DirectX End-User Runtime (June 2010)" [ref=f37e698] [cursor=pointer]:
                      - /url: http://www.microsoft.com/en-us/download/details.aspx?id=8109
                    - text: (required regardless of OS)
                  - listitem [ref=f37e699]:
                    - link "Visual C++ Redistributable for Visual Studio 2013" [ref=f37e700] [cursor=pointer]:
                      - /url: http://www.microsoft.com/en-us/download/details.aspx?id=40784
                    - text: (
                    - strong [ref=f37e701]: for x64 systems install both x86 and x64 redistributables
                    - text: )
                  - listitem [ref=f37e702]: If you upgraded to Windows 10, you must Uninstall and Reinstall the Visual C++ Redistributable
                - paragraph [ref=f37e703]: "Notes:"
                - list [ref=f37e704]:
                  - listitem [ref=f37e705]: Most game's executables are 32-bit and require x86 x360ce and also the x86 redistributable.
                  - listitem [ref=f37e706]:
                    - text: Vista users can obtain .NET 3.5 from the above link, and Windows 8 users can enable it in
                    - link "Programs and Features - Turn Windows Features on and off." [ref=f37e707] [cursor=pointer]:
                      - /url: http://msdn.microsoft.com/en-us/library/hh506443.aspx
                  - listitem [ref=f37e708]:
                    - strong [ref=f37e709]: .NET MUST be installed prior to the DirectX webupdate as it checks that .NET 2.0/3.0/3.5 is installed and skips the Managed DirectX framework if it is not.
                  - listitem [ref=f37e710]: The full DirectX Redistributable will always install the file, however it's best to have .NET 3.5 installed anyhow as quite a few XInput titles utilize .NET for internal dependencies.
                - generic [ref=f37e711]:
                  - heading "Files" [level=1] [ref=f37e712]
                  - 'link "Permalink: Files" [ref=f37e713] [cursor=pointer]':
                    - /url: "#files"
                    - img [ref=f37e714]
                - paragraph [ref=f37e716]:
                  - text: xinput1_3.dll (Wrapper Library) - Translates XInput calls to DirectInput calls - supports old, non-XInput compatible GamePads.
                  - text: x360ce.exe - (Application) - Allows for editing and testing of Library settings.
                  - text: x360ce.ini - (Configuration) - Contain Library settings (button, axis, slider maps).
                  - text: x360ce.gdb - (Game Database) Includes required hookmasks for various games).
                  - text: Dinput8.dll - (DirectInput 8 spoof/wrapping file to improve x360ce compatibility in rare cases).
                - generic [ref=f37e717]:
                  - heading "Installation" [level=1] [ref=f37e718]
                  - 'link "Permalink: Installation" [ref=f37e719] [cursor=pointer]':
                    - /url: "#installation"
                    - img [ref=f37e720]
                - paragraph [ref=f37e722]: "Run this program from the same directory as the game executable. XInput library files exist with several different names and some games require a change in its name. Known names:"
                - list [ref=f37e723]:
                  - listitem [ref=f37e724]: xinput1_4.dll (Windows 8 / metro apps only)
                  - listitem [ref=f37e725]: xinput1_3.dll
                  - listitem [ref=f37e726]: xinput1_2.dll
                  - listitem [ref=f37e727]: xinput1_1.dll
                  - listitem [ref=f37e728]: xinput9_1_0.dll
                - paragraph [ref=f37e729]: Game Database (GDB) and Configuration (INI) files can be copied to %ALLUSERSPROFILE%\X360CE on NT6 (Vista/7/8) or %ALLUSERSPROFILE%\Application Data\X360CE on NT5.1 (XP), or be left in the same directory as the game's executable (.EXE)
                - paragraph [ref=f37e730]: "Note:"
                - list [ref=f37e731]:
                  - listitem [ref=f37e732]: In most cases games based on the Source engine have the DLL placed inside the /Bin/ sub folder, as it is loaded by inputsystem.dll instead of the game executable.
                  - listitem [ref=f37e733]: The DLL is not currently fully supported by the App, recent versions incorporate HookMasks and fully remove HookModes, and requires placing Version=1 under [options] in the x360ce.ini to quieten a warning about incorrect version.
                - generic [ref=f37e734]:
                  - heading "Uninstallation" [level=1] [ref=f37e735]
                  - 'link "Permalink: Uninstallation" [ref=f37e736] [cursor=pointer]':
                    - /url: "#uninstallation"
                    - img [ref=f37e737]
                - paragraph [ref=f37e739]: Delete x360ce.exe, x360ce.ini and all XInput DLLs from the game's executable directory.
                - generic [ref=f37e740]:
                  - heading "How to remove HID Guardian if access to your Mouse and Keyboard is lost (X360CE v4.x)" [level=3] [ref=f37e741]
                  - 'link "Permalink: How to remove HID Guardian if access to your Mouse and Keyboard is lost (X360CE v4.x)" [ref=f37e742] [cursor=pointer]':
                    - /url: "#how-to-remove-hid-guardian-if-access-to-your-mouse-and-keyboard-is-lost-x360ce-v4x"
                    - img [ref=f37e743]
                - paragraph [ref=f37e745]:
                  - text: "Instructions:"
                  - link "https://github.com/x360ce/x360ce/wiki/HID-Guardian" [ref=f37e746] [cursor=pointer]:
                    - /url: https://github.com/x360ce/x360ce/wiki/HID-Guardian
                - generic [ref=f37e747]:
                  - heading "Troubleshooting" [level=1] [ref=f37e748]
                  - 'link "Permalink: Troubleshooting" [ref=f37e749] [cursor=pointer]':
                    - /url: "#troubleshooting"
                    - img [ref=f37e750]
                - paragraph [ref=f37e752]: Some games have control issues when Dead Zone is reduced to 0%.
                - paragraph [ref=f37e753]: You may need to increase the Anti-Dead Zone value if there is gap between the moment when you start to push the axis-related button and the reaction in game.
                - paragraph [ref=f37e754]:
                  - strong [ref=f37e755]: Wheel doesn't work in the game, but it works inside x360ce Application.
                - paragraph [ref=f37e756]: "Some controllers will only operate in game if they are set as \"GamePad\". Try to:"
                - list [ref=f37e757]:
                  - listitem [ref=f37e758]: Run x360ce.exe
                  - listitem [ref=f37e759]: "Select the [Controller #] tab page corresponding to your controller."
                  - listitem [ref=f37e760]: Open [Advanced] tab page.
                  - listitem [ref=f37e761]: "Set \"Device Type\" drop down list value to: GamePad."
                  - listitem [ref=f37e762]: Click [Save] button.
                  - listitem [ref=f37e763]: Close x360ce.exe.
                  - listitem [ref=f37e764]: Run the game.
                - paragraph [ref=f37e765]: "Only one controller, mapped to PAD1, may work correctly in some games. Try to:"
                - list [ref=f37e766]:
                  - listitem [ref=f37e767]: Run x360ce.exe
                  - listitem [ref=f37e768]: "Select the [Controller #] tab page corresponding to your controller."
                  - listitem [ref=f37e769]: Open the [Direct Input Device] tab page (visible when the controller is connected).
                  - listitem [ref=f37e770]: "Set \"Map To\" drop down list value to: 1."
                  - listitem [ref=f37e771]:
                    - text: Set "Map To" drop down list values
                    - emphasis [ref=f37e772]: (repeat steps 2. to 4.)
                    - text: "for other controllers, if you have them, to: 2, 3 or 4."
                  - listitem [ref=f37e773]: Click [Save] button.
                  - listitem [ref=f37e774]: Close x360ce.exe.
                  - listitem [ref=f37e775]: Run the game.
                - paragraph [ref=f37e776]: "To use more than one controller in game, you may need to combine them. Try to:"
                - list [ref=f37e777]:
                  - listitem [ref=f37e778]: Run x360ce.exe
                  - listitem [ref=f37e779]: "Select the [Controller #] tab page corresponding to your additional controller."
                  - listitem [ref=f37e780]: Open the [Advanced] tab page.
                  - listitem [ref=f37e781]: "Set \"Combine Into\" drop down list value to: One."
                  - listitem [ref=f37e782]: Select [Options] tab page.
                  - listitem [ref=f37e783]:
                    - text: Check "Enable Combining" check-box.
                    - emphasis [ref=f37e784]: "(Note: Uncheck \"Enable Combining\" check-box when you want to configure the controller.)"
                  - listitem [ref=f37e785]: Click [Save] button.
                  - listitem [ref=f37e786]: Close x360ce.exe.
                  - listitem [ref=f37e787]: Run the game.
                - paragraph [ref=f37e788]:
                  - strong [ref=f37e789]: Do I need to run x360ce Application during the game?
                - paragraph [ref=f37e790]: The x360ce.exe application can be closed before launching the game; the game doesn't need it and it uses your computer's resources. The x360ce.exe application is just a GUI for editing x360ce.ini and testing your controller.
                - paragraph [ref=f37e791]:
                  - strong [ref=f37e792]: Warning - Configuration file version does not match x360ce version.
                - paragraph [ref=f37e793]: This occurs because the current version of the application is not completely compatible with the DLL just yet. You can resolve this by adding Version=1 under the [Options] section in x360ce.ini
                - paragraph [ref=f37e794]:
                  - strong [ref=f37e795]: Controller tab won't turn green / Red light on Controller 1, 2 etc.
                - paragraph [ref=f37e796]: "This can occur for a number of reasons:"
                - list [ref=f37e797]:
                  - listitem [ref=f37e798]: The configuration utility DOES NOT work with the 64-bit library, it will only work with the 32-bit version, This is the case regardless of whether your Windows is 32-bit or 64-bit.
                  - listitem [ref=f37e799]: The DInput state of the controller might be incorrect due to an application crashing previously and not unloading the controller or some other reason. Opening up Joy.cpl (Set Up USB Game Controllers) and clicking the Advanced button, and then Okaying out of the window that appears can fix it.
                  - listitem [ref=f37e800]: The controller profile loaded may match the name of the controller but not actually be for the controller you own - in this case you might see button numbers or axes mapped that do not appear in the Joy.cpl test page.
                  - listitem [ref=f37e801]: The controller profile might have PassThrough set. A growing number of profiles have been uploaded that do this, I have no idea why as it disables x360ce and just bloats the list of available profiles.
                  - listitem [ref=f37e802]: There just might not be a profile for your control at all - The light should turn green at least once the 2 sticks, triggers and D-pad are assigned. Sometimes the application needs to be restarted after assigning these for the light to turn green.
                - generic [ref=f37e803]:
