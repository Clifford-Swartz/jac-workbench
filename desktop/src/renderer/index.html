<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob: 'self';">
    <link href="styles.css" rel="stylesheet">
    <title>JAC</title>
    <style>
        @font-face {
            font-family: 'seti';
            src: url('./seti.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: #191919;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
        }

        /* Traffic light spacer — hiddenInset puts circles at top-left.
           Pure drag region, no label. */
        #titlebar {
            height: 32px;
            -webkit-app-region: drag;
            flex-shrink: 0;
            background: #191919;
        }

        #main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ── Activity Bar ────────────────────────────── */
        #activity-bar {
            width: 48px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #191919;
            border-right: 1px solid #2b2b2b;
        }

        .activity-btn {
            width: 48px;
            height: 48px;
            background: none;
            border: none;
            border-left: 2px solid transparent;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            opacity: 0.55;
            transition: opacity 0.12s;
            flex-shrink: 0;
        }
        .activity-btn:hover { opacity: 1; background: rgba(255,255,255,0.04); }
        .activity-btn.active { opacity: 1; border-left-color: #d97757; color: #d4d4d4; }

        /* ── Sidebar ─────────────────────────────────── */
        #sidebar {
            width: 240px;
            min-width: 160px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            background: #191919;
            border-right: 1px solid #2b2b2b;
            user-select: none;
            flex-shrink: 0;
        }

        #sidebar-header {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            background: #191919;
            border-bottom: 1px solid #2b2b2b;
            flex-shrink: 0;
        }

        #sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .sidebar-icon-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 13px;
            line-height: 1;
            flex-shrink: 0;
        }
        .sidebar-icon-btn:hover { background: rgba(255,255,255,0.04); color: #d4d4d4; }

        #breadcrumb {
            padding: 4px 8px;
            font-size: 11px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid #2b2b2b;
            flex-shrink: 0;
            overflow: hidden;
        }
        #breadcrumb span {
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #breadcrumb span:hover { color: #d4d4d4; }
        #back-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            padding: 0 2px;
            flex-shrink: 0;
        }
        #back-btn:hover { color: #d4d4d4; }
        #back-btn:disabled { opacity: 0.2; cursor: default; }

        #file-tree {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .tree-entry {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            color: #d4d4d4;
        }
        .tree-entry:hover { background: rgba(255,255,255,0.04); }
        .tree-entry.selected {
            background: rgba(77,170,252,0.12);
            color: #4daafc;
        }

        .tree-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'seti';
            font-size: 15px;
            line-height: 1;
        }

        .tree-name {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            color: #d4d4d4;
        }
        .tree-entry.is-dir .tree-name { color: #a0a0b8; }
        .tree-entry.is-dir:hover .tree-name { color: #c0c0cc; }
        .tree-entry.selected .tree-name { color: #4daafc; }

        .tree-chevron {
            font-size: 10px;
            color: #888;
            flex-shrink: 0;
            transition: transform 0.1s;
        }

        .tree-children {
            padding-left: 14px;
        }

        #sidebar-footer {
            border-top: 1px solid #2b2b2b;
            padding: 8px;
            flex-shrink: 0;
        }

        #start-convo-btn {
            width: 100%;
            padding: 7px 10px;
            background: transparent;
            color: #d97757;
            border: 1px solid #2b2b2b;
            border-radius: 4px;
            font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s, border-color 0.15s;
        }
        #start-convo-btn:hover {
            background: rgba(217,119,87,0.08);
            border-color: rgba(217,119,87,0.4);
            color: #e8967a;
        }
        #start-convo-btn:active { background: rgba(217,119,87,0.14); }

        /* Resizer */
        #resizer {
            width: 4px;
            cursor: col-resize;
            background: transparent;
            flex-shrink: 0;
        }
        #resizer:hover, #resizer.dragging { background: rgba(77,170,252,0.25); }

        /* ── Chat area ───────────────────────────────── */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        /* Override JAC header to remove top padding (we handle it in #titlebar) */
        #app { display: flex; flex-direction: column; height: 100%; }
        #header { -webkit-app-region: no-drag; }
        #messages { flex: 1; overflow-y: auto; }

        #workflow-frame, #models-frame, #music-frame {
            display: none;
            flex: 1;
            border: none;
            min-width: 0;
            height: 100%;
        }
    </style>
</head>

    <script>
    (function() {
        // ── File Explorer ──────────────────────────────────────
        let currentPath = '';
        let selectedPath = '';
        let navStack = [];

        async function init() {
            currentPath = await window.jac.getHome();
            selectedPath = currentPath;
            renderTree();
        }

        async function renderTree() {
            const entries = await window.jac.listDir(currentPath);
            const tree = document.getElementById('file-tree');
            const label = document.getElementById('current-path-label');
            const backBtn = document.getElementById('back-btn');
            label.textContent = currentPath.replace(window._homeDir || '', '~');
            backBtn.disabled = navStack.length === 0;

            tree.innerHTML = '';
            for (const entry of entries) {
                const el = document.createElement('div');
                el.className = 'tree-entry' + (entry.isDir ? ' is-dir' : '');
                if (entry.path === selectedPath) el.classList.add('selected');

                const icon = document.createElement('span');
                icon.className = 'tree-icon';
                if (entry.isDir) {
                    icon.innerHTML = getFolderIcon();
                } else {
                    var iconData = getFileIcon(entry.name);
                    icon.textContent = iconData[0];
                    icon.style.color = iconData[1];
                }

                const name = document.createElement('span');
                name.className = 'tree-name';
                name.textContent = entry.name;

                el.appendChild(icon);
                el.appendChild(name);

                if (entry.isDir) {
                    const chev = document.createElement('span');
                    chev.className = 'tree-chevron';
                    chev.textContent = '›';
                    el.appendChild(chev);

                    el.addEventListener('click', () => {
                        navStack.push(currentPath);
                        currentPath = entry.path;
                        selectedPath = entry.path;
                        renderTree();
                    });
                } else {
                    el.addEventListener('click', () => {
                        selectedPath = entry.path;
                        document.querySelectorAll('.tree-entry.selected').forEach(e => e.classList.remove('selected'));
                        el.classList.add('selected');
                    });
                }

                tree.appendChild(el);
            }
        }

            if (prompt) prompt.focus();
        });

        const sidebar = document.getElementById('sidebar');
        let dragging = false, startX = 0, startW = 0;
        resizer.addEventListener('mousedown', e => {
            dragging = true;
            startX = e.clientX;
            startW = sidebar.offsetWidth;
            resizer.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            const w = Math.min(400, Math.max(160, startW + e.clientX - startX));
            sidebar.style.width = w + 'px';
        });
        document.addEventListener('mouseup', () => {
            dragging = false;
            resizer.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });

        function updateFindingsBadge() {
            window.jac.getPendingFindings().then(findings => {
                const badge = document.getElementById('findings-badge');
                if (!badge) return;
                const unread = findings.filter(f => !f.read);
                badge.textContent = unread.length > 0 ? String(unread.length) : '';
                badge.style.display = unread.length > 0 ? 'inline-block' : 'none';
            });
        }
        window.jac.onTaskComplete(() => updateFindingsBadge());

            var sidebar = document.getElementById('sidebar');

            var workflowFrame = document.getElementById('workflow-frame');
            var modelsFrame = document.getElementById('models-frame');
            var musicFrame = document.getElementById('music-frame');
            var savedWidth = 240;
            var activePanel = 'sidebar';
            var FULL_PANELS = ['workflow', 'models', 'music'];

            function syncActivityHeight() {
                var header = document.getElementById('header');
                var firstBtn = document.getElementById('act-explorer');
                var sidebarHdr = document.getElementById('sidebar-header');
                if (header) {
                    var h = header.offsetHeight + 'px';
                    if (firstBtn) firstBtn.style.height = h;
                    if (sidebarHdr) sidebarHdr.style.height = h;
                }
            }
            syncActivityHeight();
            window.addEventListener('load', syncActivityHeight);

            function showPanel(panel) {
                document.querySelectorAll('.activity-btn').forEach(function(b) { b.classList.remove('active'); });
                var btn = document.querySelector('[data-panel="' + panel + '"]');
                if (btn) btn.classList.add('active');

                var isFull = FULL_PANELS.indexOf(panel) !== -1;
                if (isFull) {
                    savedWidth = sidebar.offsetWidth || savedWidth;
                    sidebar.style.display = 'none';
                    resizer.style.display = 'none';
                    chatArea.style.display = 'none';
                    workflowFrame.style.display = panel === 'workflow' ? 'flex' : 'none';
                    modelsFrame.style.display   = panel === 'models'   ? 'flex' : 'none';
                    musicFrame.style.display    = panel === 'music'    ? 'flex' : 'none';
                } else {
                    workflowFrame.style.display = 'none';
                    modelsFrame.style.display   = 'none';
                    musicFrame.style.display    = 'none';
                    chatArea.style.display = '';
                    if (panel === 'sidebar') {
                        sidebar.style.display = '';
                        sidebar.style.width = savedWidth + 'px';
                        resizer.style.display = '';
                    } else {
                        sidebar.style.display = 'none';
                        resizer.style.display = 'none';
                    }
                }
                activePanel = panel;
            }

            document.querySelectorAll('.activity-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var panel = btn.dataset.panel;
                    if (!panel) return;
                    if (activePanel === panel && panel !== 'workflow') {
                        // Collapse sidebar toggle
                        savedWidth = sidebar.offsetWidth || savedWidth;
                        sidebar.style.display = 'none';
                        resizer.style.display = 'none';
                        btn.classList.remove('active');
                        activePanel = null;
                    } else {
                        showPanel(panel);
                    }
                });
            });
        })();
