<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob: 'self';">
<title>Projects</title>
<style>
  :root{
    --bg:#1e1e1e; --panel:#191919; --card:#232323; --card-hi:#282828; --border:#2f2f2f;
    --fg:#d4d4d4; --dim:#8a8a8a; --faint:#5f5f5f; --accent:#d97757; --accent-soft:rgba(217,119,87,.13);
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;overflow-y:auto;
    background-image:radial-gradient(130% 90% at 100% -10%,var(--accent-soft),transparent 55%)}
  .page{max-width:1040px;margin:0 auto;padding:40px 32px 60px}
  header.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:6px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  h1{font-size:30px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--dim);margin-top:8px;font-size:14px}
  .count{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap;padding-bottom:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px;margin-top:26px}
  .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
    cursor:pointer;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;gap:11px;min-height:158px;
    transition:transform .13s ease,border-color .13s ease,background .13s ease,box-shadow .13s ease}
  .card:hover{transform:translateY(-3px);background:var(--card-hi);border-color:color-mix(in srgb,var(--accent) 55%,var(--border));
    box-shadow:0 10px 30px -14px var(--accent)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
  .ico svg{width:22px;height:22px}
  .nm{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .desc{color:var(--dim);font-size:12.5px;line-height:1.45;flex:1}
  .meta{display:flex;align-items:center;gap:8px;margin-top:2px}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    border:1px solid var(--border);border-radius:5px;padding:2px 7px}
  .tag.live{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
  .tag.ext{color:var(--dim)}
  .go{margin-left:auto;color:var(--faint);font-size:15px;opacity:0;transform:translateX(-4px);transition:opacity .13s,transform .13s}
  .card:hover .go{opacity:1;transform:none;color:var(--accent)}
  .foot{margin-top:34px;color:var(--faint);font-size:12px;font-family:var(--mono)}
</style>
</head>
<body>
<div class="page">
  <header class="hd">
    <div>
      <div class="eyebrow">JAC · home base</div>
      <h1>Projects</h1>
      <p class="sub">The work I actually care about — jump straight in.</p>
    </div>
    <div class="count" id="count"></div>
  </header>
  <div class="grid" id="grid"></div>
  <p class="foot">Add a project by editing <span style="color:var(--dim)">projects.html</span>.</p>
</div>
<script>
const IC={
  scroll:'<path d="M8 3H6a2 2 0 0 0-2 2v12a3 3 0 0 0 3 3h11a2 2 0 0 0 2-2V7"/><path d="M4 5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v13"/><line x1="8" y1="8" x2="14" y2="8"/><line x1="8" y1="12" x2="14" y2="12"/>',
  sliders:'<line x1="4" y1="8" x2="20" y2="8"/><circle cx="9" cy="8" r="2.4" fill="var(--card)"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.4" fill="var(--card)"/>',
  bolt:'<path d="M9 3h6"/><path d="M10 3v6l-5 8.5A2 2 0 0 0 6.7 21h10.6a2 2 0 0 0 1.7-3.5L14 9V3"/><line x1="7.5" y1="15" x2="16.5" y2="15"/>',
  cube:'<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/>',
  board:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.4"/><circle cx="16" cy="16" r="1.4"/><path d="M8 8h5a3 3 0 0 1 3 3v5"/>',
  chart:'<line x1="5" y1="18" x2="5" y2="12"/><line x1="12" y1="18" x2="12" y2="7"/><line x1="19" y1="18" x2="19" y2="10"/><line x1="3" y1="20" x2="21" y2="20"/>'
};
const PROJECTS=[
  {nm:"Vesuvius Challenge", icon:"scroll", desc:"Read the carbonized Herculaneum scroll — normal-averaged ink, seam-reader loop.", tag:"reader", cls:"live",
    view:"vesuvius"},
  {nm:"Steering & Surgery", icon:"sliders", desc:"Control-vector personality mixer + neuron-level attribution and editing.", tag:"open", view:"neuro"},
  {nm:"Zeldovich", icon:"bolt", desc:"Plasma N₂-fixation research — provenance-tiered experiment ledger + solver.", tag:"open", view:"zeldovich"},
  {nm:"CAD", icon:"cube", desc:"Parametric modelling — build, export STL/GLTF.", tag:"open", view:"cad"},
  {nm:"PCB", icon:"board", desc:"Place footprints, route, fabricate — schematic to board.", tag:"open", view:"pcb"},
  {nm:"Stocks", icon:"chart", desc:"Watchlist and market readout.", tag:"open", view:"stocks"}
];
function open(p){
  try{
    if(p.url && window.parent.jac && window.parent.jac.openExternal) window.parent.jac.openExternal(p.url);
    else if(p.view && window.parent.jacOpenView) window.parent.jacOpenView(p.view);
  }catch(e){ console.warn('open project failed',e); }
}
const grid=document.getElementById('grid');
PROJECTS.forEach(p=>{
  const c=document.createElement('button'); c.className='card';
  c.innerHTML=`<div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${IC[p.icon]||''}</svg></div>
    <div class="nm">${p.nm}</div>
    <div class="desc">${p.desc}</div>
    <div class="meta"><span class="tag ${p.cls||''}">${p.tag}</span>${p.url?'<span class="tag ext">browser ↗</span>':''}<span class="go">→</span></div>`;
  c.addEventListener('click',()=>open(p));
  grid.appendChild(c);
});
document.getElementById('count').textContent=PROJECTS.length+' projects';
</script>
</body>
</html>
